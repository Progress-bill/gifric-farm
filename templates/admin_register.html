{% extends "base.html" %}

{% block title %}Admin Signup - {{ company_name }}{% endblock %}

{% block content %}

<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl border border-gray-100 shadow-xl p-8 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-amber-100 text-amber-800 rounded-2xl flex items-center justify-center text-2xl mx-auto font-bold shadow-inner">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-gray-900 serif-font">Admin Account Signup</h1>
            <p class="text-xs text-gray-500">Create a new administrator account for Gifric Farm management.</p>
        </div>

        <form action="{{ url_for('admin_register') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Username *</label>
                <input type="text" name="username" required placeholder="e.g. manager1" 
                       class="w-full text-sm bg-gray-50 border border-gray-200 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Email Address *</label>
                <input type="email" name="email" required placeholder="manager@gifricfarm.com" 
                       class="w-full text-sm bg-gray-50 border border-gray-200 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Password *</label>
                <input type="password" name="password" required minlength="6" placeholder="At least 6 characters" 
                       class="w-full text-sm bg-gray-50 border border-gray-200 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Confirm Password *</label>
                <input type="password" name="confirm_password" required minlength="6" placeholder="Re-enter password" 
                       class="w-full text-sm bg-gray-50 border border-gray-200 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white">
            </div>

            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-extrabold py-3.5 px-4 rounded-xl shadow transition text-sm">
                Create Admin Account
            </button>
        </form>

        <div class="pt-4 border-t border-gray-100 text-center text-xs text-gray-500">
            Already have an account? 
            <a href="{{ url_for('admin_login') }}" class="font-bold text-emerald-700 hover:underline">Log In</a>
        </div>

    </div>
</div>

{% endblock %}
