{% extends "base.html" %}

{% block title %}Your Shopping Cart - {{ company_name }}{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto px-4 py-12">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-6 serif-font">Your Shopping Basket</h1>

    <div class="bg-white rounded-3xl border border-gray-100 p-6 sm:p-8 shadow-sm">
        <div id="cart-page-items" class="space-y-4">
            <!-- Dynamically populated -->
        </div>

        <div class="border-t border-gray-100 mt-8 pt-6 flex flex-col sm:flex-row justify-between items-center">
            <a href="{{ url_for('products') }}" class="text-xs font-bold text-gray-600 hover:text-emerald-700 mb-4 sm:mb-0">
                <i class="fa-solid fa-arrow-left mr-1"></i> Continue Shopping
            </a>
            <div class="text-right w-full sm:w-auto">
                <div class="text-xs text-gray-500 mb-1">Subtotal</div>
                <div id="cart-page-subtotal" class="text-2xl font-black text-emerald-950 mb-4">$0.00</div>
                <a href="{{ url_for('checkout') }}" class="inline-block w-full sm:w-auto bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-sm px-8 py-3.5 rounded-xl shadow transition">
                    Proceed to Checkout <i class="fa-solid fa-arrow-right ml-1"></i>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('cart-page-items');
        const subtotalEl = document.getElementById('cart-page-subtotal');
        
        if (gifricCart.cart.length === 0) {
            container.innerHTML = `
                <div class="text-center py-12">
                    <p class="text-gray-500 text-sm mb-4">Your cart is currently empty.</p>
                    <a href="{{ url_for('products') }}" class="bg-emerald-700 text-white font-bold text-xs px-6 py-3 rounded-xl">Explore Fresh Products</a>
                </div>
            `;
            subtotalEl.textContent = '$0.00';
            return;
        }

        container.innerHTML = gifricCart.cart.map(item => `
            <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border border-gray-100">
                <div class="flex items-center space-x-4">
                    <img src="${item.image_url}" alt="${item.name}" class="w-16 h-16 object-cover rounded-xl">
                    <div>
                        <h4 class="text-sm font-bold text-gray-900">${item.name}</h4>
                        <span class="text-xs text-emerald-700 font-semibold">$${item.price.toFixed(2)} / ${item.unit}</span>
                    </div>
                </div>
                <div class="flex items-center space-x-6">
                    <div class="flex items-center space-x-2">
                        <button onclick="gifricCart.updateQuantity(${item.id}, ${item.quantity - 1}); location.reload();" class="w-8 h-8 rounded bg-gray-200 font-bold">-</button>
                        <span class="font-bold text-sm w-6 text-center">${item.quantity}</span>
                        <button onclick="gifricCart.updateQuantity(${item.id}, ${item.quantity + 1}); location.reload();" class="w-8 h-8 rounded bg-gray-200 font-bold">+</button>
                    </div>
                    <span class="font-extrabold text-sm text-gray-900">$${(item.price * item.quantity).toFixed(2)}</span>
                    <button onclick="gifricCart.removeItem(${item.id}); location.reload();" class="text-red-500 hover:text-red-700 text-xs">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </div>
        `).join('');

        subtotalEl.textContent = `$${gifricCart.getTotalPrice().toFixed(2)}`;
    });
</script>

{% endblock %}
