{% extends "base.html" %}

{% block title %}Admin Login - {{ company_name }}{% endblock %}

{% block content %}

<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl border border-gray-100 shadow-xl p-8 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-emerald-100 text-emerald-800 rounded-2xl flex items-center justify-center text-2xl mx-auto font-bold shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-gray-900 serif-font">Admin Portal Login</h1>
            <p class="text-xs text-gray-500">Sign in to manage Gifric Farm stock, products, and customer orders.</p>
        </div>

        <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Username or Email</label>
                <input type="text" name="username" required placeholder="admin or admin@gifricfarm.com" 
                       class="w-full text-sm bg-gray-50 border border-gray-200 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="adminPassword" name="password" required placeholder="••••••••" 
                           class="w-full text-sm bg-gray-50 border border-gray-200 rounded-xl p-3 pr-11 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white">
                    <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-emerald-700 focus:outline-none transition-colors" title="Show or hide password">
                        <i id="togglePasswordIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold py-3.5 px-4 rounded-xl shadow transition text-sm">
                Sign In to Dashboard
            </button>
        </form>

    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const passwordInput = document.getElementById('adminPassword');
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const toggleIcon = document.getElementById('togglePasswordIcon');

        if (toggleBtn && passwordInput && toggleIcon) {
            toggleBtn.addEventListener('click', function () {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                if (isPassword) {
                    toggleIcon.classList.remove('fa-eye');
                    toggleIcon.classList.add('fa-eye-slash');
                } else {
                    toggleIcon.classList.remove('fa-eye-slash');
                    toggleIcon.classList.add('fa-eye');
                }
            });
        }
    });
</script>

{% endblock %}
